# ShopPro 主配置
# 支持 1.18.2 ~ 26.x

# 限购数据存储
storage:
  # sqlite 单服使用 数据存在插件目录的 sqlite.db
  # mysql 多服共享限购数据时使用
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    user: "root"
    password: "123456"
    database: "shoppro"
    ssl: false

# 交易音效 留空则不播放
# 填原版音效 ID 例如 entity.experience_orb.pickup
sound:
  # 交易成功
  success: ''
  # 交易失败 余额不足/物品不够/达到限购
  failure: ''

# 内部数据 请勿修改
internal:
  # 上次重置限购数据的日期
  last-reset-day: 0
