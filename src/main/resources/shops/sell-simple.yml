# 不限购的简易收购商店
#
# 不写 limit-server 和 limit-player 时默认不限制
# 适合矿物 食物这类想让玩家随便卖的东西

type: sell

name: "简易收购商店"

title: "系统收购商店"

layout:
  - 'NNNNNNNNN'
  - 'NQWERTYUN'
  - 'NIO     N'
  - 'NNNNNNNNX'

items:
  N:
    material: GLASS_PANE
    name: ' '
    lore:
      - ' '
    is-commodity: false

  # 跳转到另一个商店的按钮
  # [open] 后面填目标商店的 name 字段
  X:
    material: ARROW
    name: '&f下一页'
    lore:
      - '&f点击前往限购收购商店'
    is-commodity: false
    commands:
      - '[open] 默认收购商店'

  Q:
    material: COAL
    name: '&f&l煤炭'
    price: 0.5
    lore:
      - '&a&l左键 &f&l出售单个'
